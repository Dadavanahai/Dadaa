<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Crush ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .page {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .page.active {
      display: flex;
    }

    h1 {
      font-size: clamp(28px, 7vw, 55px);
      margin-bottom: 40px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    button {
      border: none;
      padding: 16px 30px;
      border-radius: 50px;
      background: white;
      color: #ff4f81;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* The dodging button on page 4 */
    #noButton {
      position: fixed;
      transition: left 0.15s ease, top 0.15s ease;
    }

    .heart {
      font-size: 70px;
      margin-bottom: 20px;
      animation: heartbeat 1s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }
  </style>
</head>

<body>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <div class="heart">❤️</div>
    <h1>Do you wanna know who is my crush?</h1>
    <button onclick="nextPage(2)">Yes, tell me! 👀</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2">
    <div class="heart">💕</div>
    <h1>Do you really wanna know my crush?</h1>
    <button onclick="nextPage(3)">Yes, I really do! 😍</button>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <div class="heart">💗</div>
    <h1>So do you want to really know my crush?</h1>
    <button onclick="nextPage(4)">YES! Tell me! ❤️</button>
  </div>

  <!-- PAGE 4 -->
  <div class="page" id="page4">
    <div class="heart">🥰</div>
    <h1>My crush is...</h1>

    <!-- Change this text to whatever you want -->
    <p style="font-size: 25px; margin-bottom: 30px;">
      
    </p>

    <button id="noButton">Click me 😏</button>
  </div>

  <script>
    function nextPage(pageNumber) {
      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });

      document.getElementById("page" + pageNumber).classList.add("active");

      if (pageNumber === 4) {
        setupDodgingButton();
      }
    }

    function setupDodgingButton() {
      const button = document.getElementById("noButton");

      // Put the button in the middle initially
      button.style.left = "50%";
      button.style.top = "65%";
      button.style.transform = "translate(-50%, -50%)";

      function moveButton() {
        const buttonWidth = button.offsetWidth;
        const buttonHeight = button.offsetHeight;

        const padding = 20;

        const maxX = window.innerWidth - buttonWidth - padding;
        const maxY = window.innerHeight - buttonHeight - padding;

        const randomX =
          Math.floor(Math.random() * (maxX - padding + 1)) + padding;

        const randomY =
          Math.floor(Math.random() * (maxY - padding + 1)) + padding;

        button.style.left = randomX + "px";
        button.style.top = randomY + "px";
        button.style.transform = "none";
      }

      // Desktop: move when mouse gets close
      button.addEventListener("mouseenter", moveButton);

      // Mobile: move when finger touches/tries to tap it
      button.addEventListener("touchstart", function(event) {
        event.preventDefault();
        moveButton();
      });

      // Also handle clicks just in case
      button.addEventListener("click", function(event) {
        event.preventDefault();
        moveButton();
      });
    }
  </script>

</body>
</html>
